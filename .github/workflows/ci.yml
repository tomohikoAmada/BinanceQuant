name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-tests:
    name: Python tests (Ubuntu 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Checkout Contracts & Recorder Python baselines
        run: |
          git clone --depth 1 https://github.com/tomohikoAmada/BinanceMarketDataContracts.git /tmp/contracts
          git clone --depth 1 --branch S-BMDR https://github.com/tomohikoAmada/BinanceMarketDataRecorder.git /tmp/recorder
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" /tmp/contracts /tmp/recorder/vendor/python-baseline
      - name: Run pytest
        run: pytest -v

  nautilus-tests:
    name: Nautilus M-NT1+M-NT2+M-NT2.5+M-NT2.6+M-NT3 tests (Ubuntu 3.13 uv locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Checkout Contracts Python baseline
        run: |
          git clone --depth 1 https://github.com/tomohikoAmada/BinanceMarketDataContracts.git /tmp/contracts
      - name: Install locked Python 3.13 environment
        run: |
          uv python install 3.13
          uv venv --python 3.13 .venv-nautilus
          uv pip install --python .venv-nautilus/bin/python --require-hashes -r locks/nautilus-py313.lock
          uv pip install --python .venv-nautilus/bin/python --no-deps -e /tmp/contracts -e .
      - name: Run Nautilus pytest
        run: .venv-nautilus/bin/python -m pytest -v tests/test_mnt1_nautilus.py tests/test_mnt2_nautilus.py tests/test_mnt2_5_nautilus.py tests/test_mnt2_6_nautilus.py tests/test_mnt3_usdm.py
