[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-quant"
version = "0.1.0"
description = "Downstream single-repo quantitative research, causal backtesting, and paper/live signal runtime for BinanceMarketData"
requires-python = ">=3.11"
dependencies = [
    "cbor2>=6.0",
    "duckdb>=1.0",
    "google-crc32c>=1.5",
    "grpcio>=1.81.1",
    "numpy>=2.0",
    "protobuf>=6.33.5,<7",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "scipy>=1.14",
    "zstandard>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bq_feed*", "bq_feature*", "bq_model*", "bq_backtest*", "bq_mcp*", "bq_signal*", "bq_order*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
